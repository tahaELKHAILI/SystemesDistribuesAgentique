spring.application.name=bank-ai-agent
server.port=8080
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.model.chat=ollama
spring.ai.ollama.chat.model=llama3.2:latest
spring.ai.mcp.client.streamable-http.connections.bankAccount-service.url=http://localhost:8082/mcp
spring.ai.mcp.client.streamable-http.connections.customer-service.url=http://localhost:8081/mcp
spring.config.import=optional:file:.env[.properties],optional:file:bank-ai-agent/.env[.properties]
discord.token=${DISCORD_BOT_TOKEN}
telegram.token=${TELEGRAM_BOT_TOKEN}
eureka.client.jersey.enabled=false